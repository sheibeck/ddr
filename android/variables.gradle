ext {
    minSdkVersion = 24
    // NOTE: Capacitor 8's default template pins compileSdkVersion/
    // targetSdkVersion = 36, but this build machine's Android SDK has ONLY
    // platforms;android-37.0 installed (no android-36) and no cmdline-tools/
    // sdkmanager to install additional platforms headlessly. Per an explicit
    // executor-level decision (02-02-SUMMARY.md "Deviations"), this project
    // targets the installed android-37 platform instead, paired with
    // buildToolsVersion "36.0.0" pinned explicitly in app/build.gradle (the
    // only build-tools version installed on this machine).
    compileSdkVersion = 37
    targetSdkVersion = 37
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}