# Player bug reports (Phase 79.3, BUG-04, D-14; Phase 83 Plan 10, SRV-11
# retention cleanup).
#
# Reads new reports written to Firestore (delve-die-repeat-6ba5f) by the
# in-app REPORT A BUG sheet and files each one as a public, labelled issue
# on this repo via tools/bug-reports/file-issues.mjs. The same run also
# deletes filed and failed reports and stale reportLimits/{uid} documents
# on their retention schedule (docs/BUG-REPORTS.md "Retention"): a filed
# report whose Oracle fit whole is deleted right after filing; one whose
# Oracle was trimmed keeps its document for 30 days after it was filed; a
# failed report is deleted 30 days after it failed; a reportLimits document
# is deleted 2 days after its last write. The public GitHub issues are
# never deleted. Runs on Node 22 with zero package installs: the script
# uses only Node built-ins plus tools/bug-reports/issue-format.mjs.
#
# GitHub disables a scheduled workflow in a public repo after 60 days with
# no repository activity. If that happens, reports simply wait safely in
# Firestore (status "new") until this workflow is re-enabled from the
# Actions tab — nothing is lost, and the next run picks them up.
#
# A dry run (reads and logs only, files nothing) can be triggered by hand:
#   gh workflow run bug-reports.yml -f dry_run=true

name: Player bug reports

on:
  schedule:
    - cron: "7,19,33,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read and log only; file nothing"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: bug-reports
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: File new player reports
        run: node tools/bug-reports/file-issues.mjs
        env:
          FIREBASE_BUG_REPORTS_SA: ${{ secrets.FIREBASE_BUG_REPORTS_SA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
